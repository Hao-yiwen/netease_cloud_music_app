org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.vfs.watch=false
android.useAndroidX=true
android.enableJetifier=true
# 部分插件仍 apply KGP，暂保持 Flutter migrator 兼容开关
android.builtInKotlin=false
android.newDsl=false
# 部分第三方插件 Java/Kotlin jvmTarget 不一致时先警告，避免阻断构建
kotlin.jvm.target.validation.mode=warning
# Maven Central 偶发 429 时给 Gradle 更长的超时和重试，避免 CI 一次失败就停。
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.network.retry.max.attempts=8
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
