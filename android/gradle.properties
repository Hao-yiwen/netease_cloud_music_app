org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# Maven Central 偶发 429 时拉长超时并重试，避免 CI 一次失败就退出
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=8
systemProp.org.gradle.internal.repository.initial.backoff=2000
android.useAndroidX=true
android.enableJetifier=true
# 部分插件仍 apply KGP，暂保持 Flutter migrator 兼容开关
android.builtInKotlin=false
android.newDsl=false
# 部分第三方插件 Java/Kotlin jvmTarget 不一致时先警告，避免阻断构建
kotlin.jvm.target.validation.mode=warning
