# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  just_audio: ^0.10.5
  provider: ^6.1.5+1
  lottie: ^3.3.2
  go_router: ^16.2.4
  flutter_screenutil: ^5.9.3
  google_fonts: ^6.3.2
  dio: ^5.9.0
  get: ^4.7.2
  encrypt: ^5.0.3
  dio_cookie_manager: ^3.3.0
  get_it: ^8.2.0
  url_launcher: ^6.3.2
  cookie_jar: ^4.0.8
  pretty_dio_logger: ^1.4.0
  flutter_svg: ^2.2.1
  flutter_tabler_icons: ^1.43.0
  fluttertoast: ^10.0.2
  connectivity_plus: ^6.1.5
  dio_cache_interceptor: ^4.0.3
  path_provider: ^2.1.5
  path: ^1.9.1
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  auto_route: ^9.3.0+1
  carousel_slider: ^5.1.1
  dots_indicator: ^4.0.1
  easy_refresh: ^3.4.0
  audio_video_progress_bar: ^2.0.3
  gap: ^3.0.1
  skeletonizer: ^2.1.0+1
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.9.1
  package_info_plus: ^8.3.1
  webview_flutter: ^4.13.0
  intl: ^0.20.2
  audio_service: ^0.18.18
  logger: ^2.6.1
  sliver_tools: ^0.2.12
  chewie: ^1.12.1
  video_player: ^2.10.0
  shimmer: ^3.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints for
  # Flutter apps, packages, and plugins designed to encourage good coding
  # practices. The lint set provided by the analysis_options.yaml file located
  # at the root of your package is activated below.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.5
  auto_route_generator: ^9.3.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/
    - assets/anim/
    - assets/intell/
