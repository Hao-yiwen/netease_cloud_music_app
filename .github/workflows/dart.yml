name: Build Android App

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
  release:
    types: [released]

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  # master 上的构建会发 nightly 包，不中途取消。pull request 只保留最新一次。
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk
          key: android-ndk-${{ runner.os }}-flutter-3.50.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: flutter pub get

      - name: Build arm64 APK
        id: package
        run: |
          set -euo pipefail
          build_apk() {
            flutter build apk --release --target-platform android-arm64
          }
          if ! build_apk; then
            echo "release build failed, retrying once"
            sleep 20
            build_apk
          fi

          version="$(awk '/^version:/{print $2}' pubspec.yaml)"
          short="${GITHUB_SHA::7}"
          name="netease-${version}-${short}-arm64.apk"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/${name}"
          bytes="$(stat -c%s "dist/${name}")"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "bytes=${bytes}" >> "$GITHUB_OUTPUT"
          {
            echo "### Android arm64"
            echo "- \`${name}\`"
            echo "- $(numfmt --to=iec "${bytes}")"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0

  release:
    name: Release
    needs: [test, build]
    if: github.event_name == 'release' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag nightly
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        id: tag
        run: |
          tag="nightly.$(date -Iseconds | sed 's/[T:+]/-/g')"
          time="$(date '+%Y/%m/%d %H:%M')"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "time=${time}" >> "$GITHUB_OUTPUT"
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "$tag" -m "Published version ${tag}" "${GITHUB_SHA}"
          git push origin "$tag"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: artifacts

      - name: Publish nightly
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          prerelease: true
          make_latest: false
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.time }}
          body: |
            arm64 安装包，来自 `${{ github.sha }}`。
            只包含 `android-arm64`，可直接装到近年的真机。

      - name: Publish release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          prerelease: false
          make_latest: true
          body: |
            arm64 安装包，来自 `${{ github.sha }}`。
